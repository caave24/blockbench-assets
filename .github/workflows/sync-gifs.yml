name: Sync GIFs

on:
  workflow_dispatch:

  push:
    paths:
      - "clips/**"

permissions:
  contents: write

jobs:
  sync-gifs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Convert MP4s and move originals
        shell: bash
        run: |
          set -e

          mkdir -p clips/mp4

          find clips -maxdepth 1 -type f -iname "*.mp4" -print0 |
          while IFS= read -r -d '' mp4; do

            filename="$(basename "$mp4")"
            base="${filename%.*}"

            while true; do
              suffix=$(python3 -c 'import secrets; print(secrets.token_hex(4))')
              gif="clips/${base}-${suffix}.gif"

              if [ ! -e "$gif" ]; then
                break
              fi
            done

            echo "Converting:"
            echo "  $mp4"
            echo "  -> $gif"

            ffmpeg \
              -y \
              -i "$mp4" \
              -vf "fps=15,scale='min(800,iw)':-1:flags=lanczos" \
              -loop 0 \
              "$gif"

            mv "$mp4" "clips/mp4/$filename"

            echo "Moved:"
            echo "  $mp4"
            echo "  -> clips/mp4/$filename"

          done

      - name: Update index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          clips = Path("clips")

          html = index.read_text()

          # Find GIF filenames already referenced anywhere in index.html.
          # This checks the filename itself rather than requiring an
          # exact URL or exact HTML formatting.
          referenced_gifs = set(
              re.findall(
                  r'/clips/([^/"\'\s>]+\.gif)',
                  html,
                  flags=re.IGNORECASE
              )
          )

          print("GIFs already referenced in index.html:")

          for filename in sorted(referenced_gifs):
              print(f"  {filename}")

          # Only GIFs directly inside clips/ are candidates.
          # clips/mp4/ is intentionally ignored.
          gifs = sorted(
              p for p in clips.iterdir()
              if p.is_file() and p.suffix.lower() == ".gif"
          )

          additions = []

          for gif in gifs:
              filename = gif.name

              # Don't add a GIF if its filename already appears
              # in a /clips/...gif reference in index.html.
              if filename in referenced_gifs:
                  print(f"Already in HTML: {filename}")
                  continue

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  "caave24/blockbench-assets/refs/heads/main/"
                  f"clips/{filename}"
              )

              # Complete gallery block.
              block = f'''  <div class="Cell -6of12">
                              <div class="example">
                                <figure>
                                  <img src="{raw_url}" alt="{filename}">
                                </figure>
                              </div>
                            </div>
                          
                          '''

              additions.append(block)

              print(f"Adding to HTML: {filename}")

          if not additions:
              print("No new GIFs need to be added.")
              raise SystemExit(0)

          # Accept:
          #   <body>
          #   <body class="Grid">
          #   <body class="anything">
          #   <body ...>
          #
          # This prevents the script from breaking if body attributes change.
          body_match = re.search(
              r'<body\b[^>]*>',
              html,
              flags=re.IGNORECASE
          )

          if not body_match:
              raise SystemExit("Could not find <body> element in index.html")

          # Insert the new blocks immediately after the opening body tag.
          html = (
              html[:body_match.end()]
              + "\n\n"
              + "".join(additions)
              + html[body_match.end():]
          )

          index.write_text(html)

          print(f"Added {len(additions)} GIF block(s) to index.html")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clips index.html

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Convert MP4s and update GIF gallery"
          git push
