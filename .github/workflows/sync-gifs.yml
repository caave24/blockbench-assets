name: Sync GIFs

on:
  workflow_dispatch:

  push:
    paths:
      - "clips/**"

permissions:
  contents: write

jobs:
  sync-gifs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Convert new MP4s to GIFs
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import hashlib
          import json
          import secrets
          import subprocess
          from pathlib import Path

          clips = Path("clips")
          state_file = Path(".mp4-conversions.json")

          if state_file.exists():
              state = json.loads(state_file.read_text())
          else:
              state = {}

          mp4_files = sorted(
              p for p in clips.rglob("*")
              if p.is_file() and p.suffix.lower() == ".mp4"
          )

          for mp4 in mp4_files:
              # Hash the MP4 contents so the same MP4 is only converted once.
              file_hash = hashlib.sha256(mp4.read_bytes()).hexdigest()

              key = str(mp4)

              if state.get(key) == file_hash:
                  print(f"Already converted, skipping: {mp4}")
                  continue

              # Create a unique random filename.
              while True:
                  suffix = secrets.token_hex(4)
                  gif = mp4.with_name(f"{mp4.stem}-{suffix}.gif")

                  if not gif.exists():
                      break

              print(f"Converting:")
              print(f"  {mp4}")
              print(f"  -> {gif}")

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(mp4),
                      "-vf",
                      "fps=15,scale='min(800,iw)':-1:flags=lanczos",
                      "-loop",
                      "0",
                      str(gif),
                  ],
                  check=True,
              )

              state[key] = file_hash

          state_file.write_text(
              json.dumps(state, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Update index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          clips = Path("clips")

          html = index.read_text()

          gifs = sorted(
              p for p in clips.rglob("*")
              if p.is_file() and p.suffix.lower() == ".gif"
          )

          additions = []

          for gif in gifs:
              filename = gif.name

              # Only files directly inside clips/ are used for GitHub raw URLs.
              if gif.parent != clips:
                  continue

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  "caave24/blockbench-assets/refs/heads/main/"
                  f"clips/{filename}"
              )

              # Skip GIFs already present in index.html.
              if raw_url in html:
                  continue

              # Create readable alt text from filename.
              name = gif.stem

              # Remove the random 8-character suffix from MP4-generated GIFs.
              name = re.sub(r"-[0-9a-fA-F]{8}$", "", name)

              name = re.sub(r"[-_]+", " ", name)
              name = re.sub(r"([a-z])([0-9]+)$", r"\1 \2", name)
              name = name.strip().title()

              additions.append(
                  f'''  <div class="Cell -6of12">
      <div class="example">
        <figure>
          <img src="{raw_url}" alt="{name}">
        </figure>
      </div>
    </div>

'''
              )

          if not additions:
              print("No new GIFs to add.")
              raise SystemExit(0)

          marker = "<body>"

          if marker not in html:
              raise SystemExit("Could not find <body> in index.html")

          html = html.replace(
              marker,
              marker + "\n\n" + "".join(additions),
              1
          )

          index.write_text(html)

          print(f"Added {len(additions)} GIF(s) to index.html")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clips/*.gif index.html .mp4-conversions.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update GIF gallery"
          git push
