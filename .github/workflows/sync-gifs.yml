name: Sync GIFs

on:
  workflow_dispatch:

  push:
    paths:
      - "clips/**"

permissions:
  contents: write

jobs:
  sync-gifs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Convert MP4s and move originals
        shell: bash
        run: |
          set -e

          mkdir -p clips/mp4

          find clips -maxdepth 1 -type f \
            \( -iname "*.mp4" \) \
            -print0 |
          while IFS= read -r -d '' mp4; do

            filename="$(basename "$mp4")"
            base="${filename%.*}"

            # Generate a unique GIF filename.
            while true; do
              suffix=$(python3 -c 'import secrets; print(secrets.token_hex(4))')
              gif="clips/${base}-${suffix}.gif"

              if [ ! -e "$gif" ]; then
                break
              fi
            done

            echo "Converting:"
            echo "  $mp4"
            echo "  -> $gif"

            ffmpeg \
              -y \
              -i "$mp4" \
              -vf "fps=15,scale='min(800,iw)':-1:flags=lanczos" \
              -loop 0 \
              "$gif"

            # Conversion succeeded, so move the source MP4
            # into the processed MP4 archive.
            mv "$mp4" "clips/mp4/$filename"

            echo "Moved:"
            echo "  $mp4"
            echo "  -> clips/mp4/$filename"

          done

      - name: Update index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          clips = Path("clips")

          html = index.read_text()

          # Only GIFs directly inside clips/ are added.
          gifs = sorted(
              p for p in clips.iterdir()
              if p.is_file() and p.suffix.lower() == ".gif"
          )

          additions = []

          for gif in gifs:
              filename = gif.name

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  "caave24/blockbench-assets/refs/heads/main/"
                  f"clips/{filename}"
              )

              # Don't add the same GIF twice.
              if raw_url in html:
                  continue

              # Remove the random 8-character suffix from the
              # generated filename when creating alt text.
              name = gif.stem
              name = re.sub(r"-[0-9a-fA-F]{8}$", "", name)

              name = re.sub(r"[-_]+", " ", name)
              name = re.sub(r"([a-z])([0-9]+)$", r"\1 \2", name)
              name = name.strip().title()

              additions.append(
                  f'''  <div class="Cell -6of12">
      <div class="example">
        <figure>
          <img src="{raw_url}" alt="{name}">
        </figure>
      </div>
    </div>

'''
              )

          if not additions:
              print("No new GIFs to add.")
              raise SystemExit(0)

          # Add new GIFs immediately after <body>.
          marker = "<body>"

          if marker not in html:
              raise SystemExit("Could not find <body> in index.html")

          html = html.replace(
              marker,
              marker + "\n\n" + "".join(additions),
              1
          )

          index.write_text(html)

          print(f"Added {len(additions)} GIF(s) to index.html")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clips index.html

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Convert MP4s and update GIF gallery"
          git push
