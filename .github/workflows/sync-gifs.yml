name: Sync GIFs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync-gifs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Checkout blockbench-assets
        uses: actions/checkout@v4
        with:
          repository: caave24/blockbench-assets
          ref: main
          path: blockbench-assets
          token: ${{ secrets.BLOCKBENCH_ASSETS_TOKEN }}

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Convert MP4 files to GIF
        shell: bash
        run: |
          set -e

          CLIPS="blockbench-assets/clips"

          find "$CLIPS" -type f -iname "*.mp4" -print0 | while IFS= read -r -d '' mp4; do
            gif="${mp4%.*}.gif"

            if [ -f "$gif" ]; then
              echo "GIF already exists: $gif"
              continue
            fi

            echo "Converting: $mp4"
            echo "       -> $gif"

            ffmpeg \
              -y \
              -i "$mp4" \
              -vf "fps=15,scale='min(800,iw)':-1:flags=lanczos" \
              -loop 0 \
              "$gif"
          done

      - name: Commit generated GIFs to blockbench-assets
        working-directory: blockbench-assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 'clips/*.gif'

          if git diff --cached --quiet; then
            echo "No new GIFs to commit."
            exit 0
          fi

          git commit -m "Convert new MP4 clips to GIF"
          git push

      - name: Generate missing GIF HTML
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          clips = Path("blockbench-assets/clips")

          html = index.read_text()

          gifs = sorted(
              p for p in clips.rglob("*")
              if p.is_file() and p.suffix.lower() == ".gif"
          )

          additions = []

          for gif in gifs:
              filename = gif.name

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  "caave24/blockbench-assets/refs/heads/main/"
                  f"clips/{filename}"
              )

              # Don't add an image that is already in index.html.
              if raw_url in html:
                  continue

              # Turn filename into readable alt text.
              name = gif.stem
              name = re.sub(r"[-_]+", " ", name)
              name = re.sub(r"([a-z])([0-9]+)$", r"\1 \2", name)
              name = name.strip().title()

              block = f'''    <div class="Cell -6of12">
      <div class="example">
        <figure>
          <img src="{raw_url}" alt="{name}">
        </figure>
      </div>
    </div>
'''

              additions.append(block)

          if additions:
              text = html.rstrip()

              # Insert before the final Grid closing div.
              marker = "  </div>\n\n</body>"

              if marker in text:
                  text = text.replace(
                      marker,
                      "".join(additions) + "  </div>\n\n</body>",
                      1
                  )
              else:
                  raise SystemExit(
                      "Could not find the closing .Grid structure in index.html"
                  )

              index.write_text(text + "\n")

              print(f"Added {len(additions)} GIF(s) to index.html")
          else:
              print("No new GIFs to add.")

          PY

      - name: Commit updated index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "index.html is already up to date."
            exit 0
          fi

          git commit -m "Update GIF gallery"
          git push
