name: Sync GIFs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync-gifs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Convert new MP4s to GIFs
        shell: bash
        run: |
          set -e

          CLIPS="clips"

          find "$CLIPS" -type f -iname "*.mp4" -print0 | while IFS= read -r -d '' mp4; do
            gif="${mp4%.*}.gif"

            # Never regenerate an existing GIF.
            if [ -f "$gif" ]; then
              echo "Already exists, skipping: $gif"
              continue
            fi

            echo "Converting MP4:"
            echo "  $mp4"
            echo "  -> $gif"

            ffmpeg \
              -y \
              -i "$mp4" \
              -vf "fps=15,scale='min(800,iw)':-1:flags=lanczos" \
              -loop 0 \
              "$gif"
          done

      - name: Update index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          clips = Path("clips")

          html = index.read_text()

          gifs = sorted(
              p for p in clips.rglob("*")
              if p.is_file() and p.suffix.lower() == ".gif"
          )

          additions = []

          for gif in gifs:
              filename = gif.name

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  "caave24/blockbench-assets/refs/heads/main/"
                  f"clips/{filename}"
              )

              # Already present in index.html.
              if raw_url in html:
                  continue

              # Convert filename into readable alt text.
              name = gif.stem
              name = re.sub(r"[-_]+", " ", name)
              name = re.sub(r"([a-z])([0-9]+)$", r"\1 \2", name)
              name = name.strip().title()

              additions.append(
                  f'''    <div class="Cell -6of12">
      <div class="example">
        <figure>
          <img src="{raw_url}" alt="{name}">
        </figure>
      </div>
    </div>
'''
              )

          if not additions:
              print("No new GIFs to add.")
              raise SystemExit(0)

          # Add new cells immediately before the closing .Grid div.
          marker = "  </div>\n\n</body>"

          if marker not in html:
              raise SystemExit(
                  "Could not find the closing .Grid structure in index.html"
              )

          html = html.replace(
              marker,
              "".join(additions) + marker,
              1
          )

          index.write_text(html)

          print(f"Added {len(additions)} GIF(s) to index.html")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clips/*.gif index.html

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update GIF gallery"
          git push
